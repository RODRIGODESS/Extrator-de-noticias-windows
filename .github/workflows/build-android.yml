name: Build Android Extrator de Matérias

on:
  workflow_dispatch:
  push:
    branches: [ "android-v1.25.1-layout-moderno" ]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validar estrutura Android
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/br/com/extratormaterias/MainActivity.java
          test -f android/app/src/main/res/layout/activity_main.xml
          ! grep -Rni "proxy" android/app/src/main || (echo "Proxy não deve existir na versão Android" && exit 1)
          grep -q "Extrator de Matérias" android/app/src/main/res/layout/activity_main.xml
          grep -q "Texto da matéria" android/app/src/main/res/layout/activity_main.xml

      - name: Compilar APK Debug
        run: gradle -p android assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ExtratorMaterias-Android-v1.25.1-LAYOUT-MODERNO.apk

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ExtratorMaterias-Android-v1.25.1-LAYOUT-MODERNO
          path: release/ExtratorMaterias-Android-v1.25.1-LAYOUT-MODERNO.apk
          if-no-files-found: error

      - name: Publicar pre-release Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.25.1-layout-moderno
          target_commitish: android-v1.25.1-layout-moderno
          name: Extrator de Matérias Android v1.25.1 — Layout Moderno
          body: |
            Versão Android de teste com o novo layout moderno aprovado.
            Sem proxy.
            Extração via WebView com três leituras progressivas até 5 segundos para reduzir cortes em páginas carregadas dinamicamente.
            Salva materia-extraida.txt e materias-extraidas.txt em Downloads/ExtratorMaterias.
          prerelease: true
          files: release/ExtratorMaterias-Android-v1.25.1-LAYOUT-MODERNO.apk
