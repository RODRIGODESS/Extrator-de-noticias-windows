name: Build Windows Portable V1.25.9 CORRIGIDO

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Confirmar estrutura antiga preservada
        shell: powershell
        run: |
          $arquivos = @(
            "main.js",
            "preload.js",
            "renderer/index.html",
            "renderer/renderer.js",
            "renderer/styles.css",
            "engine/extrator-materia-v1.25.1.js"
          )
          foreach ($a in $arquivos) {
            if (-not (Test-Path $a)) {
              Write-Error "Arquivo da estrutura antiga ausente: $a"
              exit 1
            }
          }
          Select-String -Path "renderer/index.html" -Pattern "Extrator de Matérias" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Conexão / Proxy" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Abrir histórico" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Abrir pasta" -SimpleMatch

      - name: Gerar EXE Portable corrigido
        run: npm run dist

      - name: Verificar executavel corrigido
        shell: powershell
        run: |
          if (-not (Test-Path "dist/ExtratorMateriasPortable-V1.25.9-CORRIGIDO.exe")) {
            Write-Error "O executavel corrigido nao foi encontrado"
            exit 1
          }
          Get-Item "dist/ExtratorMateriasPortable-V1.25.9-CORRIGIDO.exe" | Format-List Name,Length,FullName

      - name: Criar pacote ZIP corrigido
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/ExtratorMateriasPortable-V1.25.9-CORRIGIDO.exe" "package/ExtratorMateriasPortable-V1.25.9-CORRIGIDO.exe"
          Copy-Item "README.md" "package/README.md"
          Compress-Archive -Path "package/*" -DestinationPath "ExtratorMaterias-Windows-Portable-V1.25.9-CORRIGIDO.zip" -Force

      - name: Enviar artefato corrigido
        uses: actions/upload-artifact@v4
        with:
          name: ExtratorMaterias-Windows-Portable-V1.25.9-CORRIGIDO
          path: ExtratorMaterias-Windows-Portable-V1.25.9-CORRIGIDO.zip
          if-no-files-found: error

      - name: Publicar Release corrigida
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.25.9-corrigido
          name: Extrator de Materias Windows Portable V1.25.9 CORRIGIDO
          body: |
            Build corrigido usando a estrutura antiga Electron/Node.js e preservando o motor V1.25.1.
            O executavel correto se chama ExtratorMateriasPortable-V1.25.9-CORRIGIDO.exe.
          files: ExtratorMaterias-Windows-Portable-V1.25.9-CORRIGIDO.zip
          make_latest: true
