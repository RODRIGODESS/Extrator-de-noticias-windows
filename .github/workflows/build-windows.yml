name: Build Windows Portable V1.25.10 TESTE

on:
  workflow_dispatch:
  push:
    branches: [ "v1.25.10-correcoes-materias" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Confirmar base antiga e camada V1.25.10
        shell: powershell
        run: |
          $arquivos = @(
            "main.js",
            "preload.js",
            "renderer/index.html",
            "renderer/renderer.js",
            "renderer/styles.css",
            "engine/extrator-materia-v1.25.1.js",
            "engine/extrator-materia-v1.25.10.js"
          )
          foreach ($a in $arquivos) {
            if (-not (Test-Path $a)) {
              Write-Error "Arquivo obrigatorio ausente: $a"
              exit 1
            }
          }
          Select-String -Path "renderer/index.html" -Pattern "Extrator de Matérias" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Conexão / Proxy" -SimpleMatch
          Select-String -Path "main.js" -Pattern "extrator-materia-v1.25.10.js" -SimpleMatch
          node --check "engine/extrator-materia-v1.25.10.js"
          node --check "main.js"

      - name: Gerar EXE Portable de teste
        run: npm run dist

      - name: Verificar executavel
        shell: powershell
        run: |
          if (-not (Test-Path "dist/ExtratorMateriasPortable-V1.25.10-TESTE.exe")) {
            Write-Error "O executavel V1.25.10 de teste nao foi encontrado"
            exit 1
          }
          Get-Item "dist/ExtratorMateriasPortable-V1.25.10-TESTE.exe" | Format-List Name,Length,FullName

      - name: Criar pacote ZIP de teste
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/ExtratorMateriasPortable-V1.25.10-TESTE.exe" "package/ExtratorMateriasPortable-V1.25.10-TESTE.exe"
          Copy-Item "README.md" "package/README.md"
          Compress-Archive -Path "package/*" -DestinationPath "ExtratorMaterias-Windows-Portable-V1.25.10-TESTE.zip" -Force

      - name: Enviar artefato V1.25.10 TESTE
        uses: actions/upload-artifact@v4
        with:
          name: ExtratorMaterias-Windows-Portable-V1.25.10-TESTE
          path: ExtratorMaterias-Windows-Portable-V1.25.10-TESTE.zip
          if-no-files-found: error

      - name: Publicar pre-release V1.25.10 TESTE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.25.10-teste
          target_commitish: v1.25.10-correcoes-materias
          name: Extrator de Matérias Windows Portable V1.25.10 TESTE
          body: |
            Versão de teste com as primeiras correções do lote de matérias.
            Base V1.25.9 preservada e motor V1.25.1 mantido intacto.
            Arquivo para teste: ExtratorMaterias-Windows-Portable-V1.25.10-TESTE.zip
          prerelease: true
          files: ExtratorMaterias-Windows-Portable-V1.25.10-TESTE.zip
