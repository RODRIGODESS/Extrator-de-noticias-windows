name: Build Windows Portable V1.25.17

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Confirmar base aprovada e camada V1.25.17
        shell: powershell
        run: |
          $arquivos = @(
            "main.js",
            "preload.js",
            "renderer/index.html",
            "renderer/renderer.js",
            "renderer/styles.css",
            "engine/config-proxy.json",
            "engine/extrator-materia-v1.25.1.js",
            "engine/extrator-materia-v1.25.10.js",
            "engine/extrator-materia-v1.25.10-runtime-base.js",
            "engine/extrator-materia-v1.25.10-runtime.js",
            "engine/extrator-materia-v1.25.11-runtime.js",
            "engine/extrator-materia-v1.25.12-runtime.js",
            "engine/extrator-materia-v1.25.13-runtime.js",
            "engine/extrator-materia-v1.25.14-runtime.js",
            "engine/extrator-materia-v1.25.15-runtime.js",
            "engine/extrator-materia-v1.25.16-runtime.js",
            "engine/extrator-materia-v1.25.17-runtime.js",
            "engine/correcoes-g1-v1.25.10.js",
            "tests/test-g1-hotfix.js",
            "tests/test-v1.25.11.js",
            "tests/test-v1.25.12.js",
            "tests/test-v1.25.13.js",
            "tests/test-v1.25.14.js",
            "tests/test-v1.25.15.js",
            "tests/test-v1.25.16.js",
            "tests/test-v1.25.17.js"
          )
          foreach ($a in $arquivos) {
            if (-not (Test-Path $a)) {
              Write-Error "Arquivo obrigatorio ausente: $a"
              exit 1
            }
          }
          Select-String -Path "renderer/index.html" -Pattern "Extrator de Matérias" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Conexão / Proxy" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Acesso de assinante" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern 'id="assinanteSenha" type="password"' -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Matéria extraída" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern "Texto da matéria" -SimpleMatch
          Select-String -Path "renderer/index.html" -Pattern 'id="senha" type="text"' -SimpleMatch
          Select-String -Path "renderer/renderer.js" -Pattern "function sincronizarBotaoExtrair" -SimpleMatch
          Select-String -Path "renderer/renderer.js" -Pattern "carregarAcessoAssinante" -SimpleMatch
          Select-String -Path "renderer/renderer.js" -Pattern "salvarAcessoAssinante" -SimpleMatch
          Select-String -Path "main.js" -Pattern "safeStorage" -SimpleMatch
          Select-String -Path "main.js" -Pattern "encryptString" -SimpleMatch
          Select-String -Path "main.js" -Pattern "decryptString" -SimpleMatch
          Select-String -Path "main.js" -Pattern "credenciais-assinante.json" -SimpleMatch
          Select-String -Path "engine/config-proxy.json" -Pattern '"SERVIDOR": "proxy-7dn.mb"' -SimpleMatch
          Select-String -Path "engine/config-proxy.json" -Pattern '"PORTA": "6060"' -SimpleMatch
          Select-String -Path "engine/extrator-materia-v1.25.10-runtime.js" -Pattern "extrator-materia-v1.25.17-runtime.js" -SimpleMatch
          Select-String -Path "main.js" -Pattern "extrator-materia-v1.25.10-runtime.js" -SimpleMatch
          node --check "renderer/renderer.js"
          node --check "engine/extrator-materia-v1.25.10.js"
          node --check "engine/extrator-materia-v1.25.10-runtime-base.js"
          node --check "engine/extrator-materia-v1.25.10-runtime.js"
          node --check "engine/extrator-materia-v1.25.11-runtime.js"
          node --check "engine/extrator-materia-v1.25.12-runtime.js"
          node --check "engine/extrator-materia-v1.25.13-runtime.js"
          node --check "engine/extrator-materia-v1.25.14-runtime.js"
          node --check "engine/extrator-materia-v1.25.15-runtime.js"
          node --check "engine/extrator-materia-v1.25.16-runtime.js"
          node --check "engine/extrator-materia-v1.25.17-runtime.js"
          node --check "engine/correcoes-g1-v1.25.10.js"
          node --check "tests/test-g1-hotfix.js"
          node --check "tests/test-v1.25.11.js"
          node --check "tests/test-v1.25.12.js"
          node --check "tests/test-v1.25.13.js"
          node --check "tests/test-v1.25.14.js"
          node --check "tests/test-v1.25.15.js"
          node --check "tests/test-v1.25.16.js"
          node --check "tests/test-v1.25.17.js"
          node --check "main.js"

      - name: Testes de regressao
        run: |
          node tests/test-g1-hotfix.js
          node tests/test-v1.25.11.js
          node tests/test-v1.25.12.js
          node tests/test-v1.25.13.js
          node tests/test-v1.25.14.js
          node tests/test-v1.25.15.js
          node tests/test-v1.25.16.js
          node tests/test-v1.25.17.js

      - name: Gerar EXE Portable
        run: npm run dist

      - name: Verificar executavel
        shell: powershell
        run: |
          if (-not (Test-Path "dist/ExtratorMateriasPortable-V1.25.17.exe")) {
            Write-Error "O executavel V1.25.17 nao foi encontrado"
            exit 1
          }
          Get-Item "dist/ExtratorMateriasPortable-V1.25.17.exe" | Format-List Name,Length,FullName

      - name: Criar pacote ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/ExtratorMateriasPortable-V1.25.17.exe" "package/ExtratorMateriasPortable-V1.25.17.exe"
          Copy-Item "README.md" "package/README.md"
          Compress-Archive -Path "package/*" -DestinationPath "ExtratorMaterias-Windows-Portable-V1.25.17.zip" -Force

      - name: Enviar artefato V1.25.17
        uses: actions/upload-artifact@v4
        with:
          name: ExtratorMaterias-Windows-Portable-V1.25.17
          path: ExtratorMaterias-Windows-Portable-V1.25.17.zip
          if-no-files-found: error

      - name: Publicar Release V1.25.17
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.25.17
          target_commitish: main
          name: Extrator de Matérias Windows Portable V1.25.17
          body: |
            Versão Windows V1.25.17 com armazenamento persistente e protegido do acesso de assinante Valor / Globo.
            - preserva integralmente o motor e as correções da V1.25.16;
            - preserva a correção do botão Extrair matéria;
            - preserva proxy corporativo e senha do proxy visível;
            - adiciona área Acesso de assinante para Valor / Globo;
            - usuário e senha são informados uma vez e permanecem cadastrados nas próximas aberturas;
            - senha é criptografada com safeStorage do Electron/Windows antes de ser gravada;
            - a tela não recebe novamente a senha descriptografada: mostra apenas que existe uma senha salva;
            - inclui opção Apagar acesso salvo;
            - usa identidade estável do aplicativo para manter o cofre entre versões futuras;
            - esta versão prepara o armazenamento seguro; o uso da sessão autenticada no motor de extração será integrado separadamente.
            Arquivo: ExtratorMaterias-Windows-Portable-V1.25.17.zip
          prerelease: false
          make_latest: true
          files: ExtratorMaterias-Windows-Portable-V1.25.17.zip
