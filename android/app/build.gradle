plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.extratormaterias'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.extratormaterias'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.25.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
}
